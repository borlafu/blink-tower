<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"
     aria-label="Illustration of drag-to-reorder: one camera tile is being dragged, shown semi-transparent with a dashed accent outline, while a gap opens between the other tiles to show where it will land. Camera views are placeholders, not real footage.">
  <defs>
    <linearGradient id="view3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22262f"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .name { fill: #e6e8ec; font-size: 13px; font-weight: 600; }
      .chip { fill: #9aa0aa; font-size: 9px; }
      .heading { fill: #e6e8ec; font-size: 14px; font-weight: 600; }
      .handle { fill: #9aa0aa; font-size: 12px; }
      .handle-hot { fill: #4c8bf5; font-size: 14px; font-weight: 700; }
      .ph { fill: #6b7280; font-size: 10px; letter-spacing: 0.04em; }
      .hint { fill: #4c8bf5; font-size: 11px; font-weight: 600; }
      .note { fill: #9aa0aa; font-size: 11px; }
    </style>
  </defs>

  <rect width="800" height="420" fill="#0e0f13"/>

  <text class="heading" x="24" y="34">Garden House · 3 camera(s)</text>
  <line x1="24" y1="44" x2="776" y2="44" stroke="#2a2d36"/>

  <!-- Static tile 1 -->
  <g transform="translate(24,64)">
    <rect width="230" height="170" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
    <rect x="1" y="1" width="228" height="92" rx="11" fill="url(#view3)"/>
    <text class="ph" x="115" y="50" text-anchor="middle">placeholder</text>
    <text class="handle" x="14" y="116">⠿</text>
    <text class="name" x="32" y="116">Driveway</text>
    <rect x="14" y="126" width="52" height="14" rx="7" fill="none" stroke="#2a2d36"/>
    <text class="chip" x="40" y="136" text-anchor="middle">● online</text>
    <rect x="72" y="126" width="46" height="14" rx="7" fill="none" stroke="#2a2d36"/>
    <text class="chip" x="95" y="136" text-anchor="middle">🔋 1.50 V</text>
  </g>

  <!-- Drop gap -->
  <g transform="translate(274,64)">
    <rect width="230" height="170" rx="12" fill="none" stroke="#4c8bf5" stroke-dasharray="6 5"/>
    <text class="hint" x="115" y="88" text-anchor="middle">drop here</text>
  </g>

  <!-- Static tile 2 -->
  <g transform="translate(524,64)">
    <rect width="230" height="170" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
    <rect x="1" y="1" width="228" height="92" rx="11" fill="url(#view3)"/>
    <text class="ph" x="115" y="50" text-anchor="middle">placeholder</text>
    <text class="handle" x="14" y="116">⠿</text>
    <text class="name" x="32" y="116">Patio</text>
    <rect x="14" y="126" width="52" height="14" rx="7" fill="none" stroke="#2a2d36"/>
    <text class="chip" x="40" y="136" text-anchor="middle">● online</text>
    <rect x="72" y="126" width="46" height="14" rx="7" fill="none" stroke="#2a2d36"/>
    <text class="chip" x="95" y="136" text-anchor="middle">🔋 1.57 V</text>
  </g>

  <!-- Dragged tile, offset and semi transparent -->
  <g transform="translate(300,250)" opacity="0.55">
    <rect width="230" height="140" rx="12" fill="#1a1c22" stroke="#4c8bf5" stroke-dasharray="5 4"/>
    <rect x="1" y="1" width="228" height="80" rx="11" fill="url(#view3)"/>
    <text class="ph" x="115" y="45" text-anchor="middle">placeholder</text>
    <text class="handle-hot" x="13" y="104">⠿</text>
    <text class="name" x="34" y="104">Garage</text>
    <rect x="14" y="114" width="52" height="14" rx="7" fill="none" stroke="#2a2d36"/>
    <text class="chip" x="40" y="124" text-anchor="middle">● online</text>
  </g>

  <!-- pointer cue -->
  <circle cx="313" cy="262" r="6" fill="#4c8bf5" opacity="0.9"/>
  <path d="M313 262 L313 236" stroke="#4c8bf5" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text class="note" x="400" y="410" text-anchor="middle">
    Grab the ⠿ handle to reorder within a location. Order is remembered in your browser.
  </text>
</svg>
