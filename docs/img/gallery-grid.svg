<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img"
     aria-label="Illustration of the blink-tower grid: two location sections with camera tiles, each tile showing metadata chips. Camera views are placeholders, not real footage.">
  <defs>
    <linearGradient id="view" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22262f"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .name { fill: #e6e8ec; font-size: 13px; font-weight: 600; }
      .chip { fill: #9aa0aa; font-size: 9px; }
      .heading { fill: #e6e8ec; font-size: 14px; font-weight: 600; }
      .handle { fill: #9aa0aa; font-size: 12px; }
      .ph { fill: #6b7280; font-size: 9px; letter-spacing: 0.04em; }
      .btn { fill: #ffffff; font-size: 9px; font-weight: 600; }
      .btn-alt { fill: #e6e8ec; font-size: 9px; font-weight: 600; }
    </style>
  </defs>

  <rect width="800" height="520" fill="#0e0f13"/>

  <!-- Location 1 -->
  <text class="heading" x="24" y="34">Main House · 2 camera(s)</text>
  <line x1="24" y1="44" x2="776" y2="44" stroke="#2a2d36"/>

  <!-- Tile 1 -->
  <g transform="translate(24,60)">
    <rect width="360" height="180" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
    <rect x="1" y="1" width="358" height="96" rx="11" fill="url(#view)"/>
    <text class="ph" x="180" y="52" text-anchor="middle">placeholder — not real footage</text>
    <text class="handle" x="14" y="120">⠿</text>
    <text class="name" x="32" y="120">Front Door</text>
    <g>
      <rect x="14" y="130" width="52" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="40" y="140" text-anchor="middle">● online</text>
      <rect x="72" y="130" width="32" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="88" y="140" text-anchor="middle">Mini</text>
      <rect x="110" y="130" width="62" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="141" y="140" text-anchor="middle">motion on</text>
    </g>
    <rect x="14" y="152" width="54" height="18" rx="6" fill="#4c8bf5"/>
    <text class="btn" x="41" y="164" text-anchor="middle">Go live</text>
    <rect x="74" y="152" width="42" height="18" rx="6" fill="none" stroke="#2a2d36"/>
    <text class="btn-alt" x="95" y="164" text-anchor="middle">Hide</text>
  </g>

  <!-- Tile 2 -->
  <g transform="translate(416,60)">
    <rect width="360" height="180" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
    <rect x="1" y="1" width="358" height="96" rx="11" fill="url(#view)"/>
    <text class="ph" x="180" y="52" text-anchor="middle">placeholder — not real footage</text>
    <text class="handle" x="14" y="120">⠿</text>
    <text class="name" x="32" y="120">Hallway</text>
    <g>
      <rect x="14" y="130" width="52" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="40" y="140" text-anchor="middle">● online</text>
      <rect x="72" y="130" width="32" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="88" y="140" text-anchor="middle">Mini</text>
      <rect x="110" y="130" width="62" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="141" y="140" text-anchor="middle">motion on</text>
    </g>
    <rect x="14" y="152" width="54" height="18" rx="6" fill="#4c8bf5"/>
    <text class="btn" x="41" y="164" text-anchor="middle">Go live</text>
    <rect x="74" y="152" width="42" height="18" rx="6" fill="none" stroke="#2a2d36"/>
    <text class="btn-alt" x="95" y="164" text-anchor="middle">Hide</text>
  </g>

  <!-- Location 2 -->
  <text class="heading" x="24" y="278">Garden House · 3 camera(s)</text>
  <line x1="24" y1="288" x2="776" y2="288" stroke="#2a2d36"/>

  <!-- Tile 3 -->
  <g transform="translate(24,304)">
    <rect width="238" height="192" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
    <rect x="1" y="1" width="236" height="96" rx="11" fill="url(#view)"/>
    <text class="ph" x="119" y="52" text-anchor="middle">placeholder</text>
    <text class="handle" x="14" y="120">⠿</text>
    <text class="name" x="32" y="120">Garage</text>
    <g>
      <rect x="14" y="130" width="52" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="40" y="140" text-anchor="middle">● online</text>
      <rect x="72" y="130" width="46" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="95" y="140" text-anchor="middle">🔋 1.70 V</text>
      <rect x="124" y="130" width="24" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="136" y="140" text-anchor="middle">ok</text>
    </g>
    <g>
      <rect x="14" y="148" width="62" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="45" y="158" text-anchor="middle">wifi ▮▮▮▯▯</text>
      <rect x="82" y="148" width="60" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="112" y="158" text-anchor="middle">71°F / 21°C</text>
    </g>
    <rect x="14" y="168" width="54" height="18" rx="6" fill="#4c8bf5"/>
    <text class="btn" x="41" y="180" text-anchor="middle">Go live</text>
    <rect x="74" y="168" width="42" height="18" rx="6" fill="none" stroke="#2a2d36"/>
    <text class="btn-alt" x="95" y="180" text-anchor="middle">Hide</text>
  </g>

  <!-- Tile 4 -->
  <g transform="translate(281,304)">
    <rect width="238" height="192" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
    <rect x="1" y="1" width="236" height="96" rx="11" fill="url(#view)"/>
    <text class="ph" x="119" y="52" text-anchor="middle">placeholder</text>
    <text class="handle" x="14" y="120">⠿</text>
    <text class="name" x="32" y="120">Driveway</text>
    <g>
      <rect x="14" y="130" width="52" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="40" y="140" text-anchor="middle">● online</text>
      <rect x="72" y="130" width="46" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="95" y="140" text-anchor="middle">🔋 1.50 V</text>
      <rect x="124" y="130" width="24" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="136" y="140" text-anchor="middle">ok</text>
    </g>
    <g>
      <rect x="14" y="148" width="62" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="45" y="158" text-anchor="middle">wifi ▮▮▮▮▯</text>
      <rect x="82" y="148" width="60" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="112" y="158" text-anchor="middle">68°F / 20°C</text>
    </g>
    <rect x="14" y="168" width="54" height="18" rx="6" fill="#4c8bf5"/>
    <text class="btn" x="41" y="180" text-anchor="middle">Go live</text>
    <rect x="74" y="168" width="42" height="18" rx="6" fill="none" stroke="#2a2d36"/>
    <text class="btn-alt" x="95" y="180" text-anchor="middle">Hide</text>
  </g>

  <!-- Tile 5, live -->
  <g transform="translate(538,304)">
    <rect width="238" height="192" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
    <rect x="1" y="1" width="236" height="96" rx="11" fill="url(#view)"/>
    <text class="ph" x="119" y="52" text-anchor="middle">placeholder</text>
    <text class="handle" x="14" y="120">⠿</text>
    <text class="name" x="32" y="120">Patio</text>
    <text x="224" y="120" text-anchor="end" fill="#f5564c" font-size="10" font-weight="700"
          font-family="system-ui, sans-serif">● LIVE</text>
    <g>
      <rect x="14" y="130" width="52" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="40" y="140" text-anchor="middle">● online</text>
      <rect x="72" y="130" width="46" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="95" y="140" text-anchor="middle">🔋 1.57 V</text>
      <rect x="124" y="130" width="24" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="136" y="140" text-anchor="middle">ok</text>
    </g>
    <g>
      <rect x="14" y="148" width="62" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="45" y="158" text-anchor="middle">wifi ▮▮▮▮▮</text>
      <rect x="82" y="148" width="60" height="14" rx="7" fill="none" stroke="#2a2d36"/>
      <text class="chip" x="112" y="158" text-anchor="middle">73°F / 23°C</text>
    </g>
    <rect x="14" y="168" width="62" height="18" rx="6" fill="none" stroke="#f5564c"/>
    <text x="45" y="180" text-anchor="middle" fill="#f5564c" font-size="9" font-weight="600"
          font-family="system-ui, sans-serif">Stop live</text>
    <rect x="82" y="168" width="42" height="18" rx="6" fill="none" stroke="#2a2d36"/>
    <text class="btn-alt" x="103" y="180" text-anchor="middle">Hide</text>
  </g>
</svg>
