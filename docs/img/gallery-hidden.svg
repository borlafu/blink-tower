<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"
     aria-label="Illustration of hiding a camera: the location heading reads two of three cameras shown, two tiles remain, and a tray underneath offers Show Patio and Show all buttons. A note explains that hidden cameras stop polling. Camera views are placeholders, not real footage.">
  <defs>
    <linearGradient id="view4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22262f"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .name { fill: #e6e8ec; font-size: 13px; font-weight: 600; }
      .chip { fill: #9aa0aa; font-size: 9px; }
      .heading { fill: #e6e8ec; font-size: 14px; font-weight: 600; }
      .handle { fill: #9aa0aa; font-size: 12px; }
      .ph { fill: #6b7280; font-size: 10px; letter-spacing: 0.04em; }
      .tray { fill: #9aa0aa; font-size: 11px; }
      .traybtn { fill: #e6e8ec; font-size: 10px; font-weight: 600; }
      .btn { fill: #ffffff; font-size: 9px; font-weight: 600; }
      .btn-alt { fill: #e6e8ec; font-size: 9px; font-weight: 600; }
      .note { fill: #9aa0aa; font-size: 11px; }
      .save { fill: #4c8bf5; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="800" height="420" fill="#0e0f13"/>

  <text class="heading" x="24" y="34">Garden House · 2 of 3 camera(s) shown</text>
  <line x1="24" y1="44" x2="776" y2="44" stroke="#2a2d36"/>

  <!-- Tile 1 -->
  <g transform="translate(24,64)">
    <rect width="360" height="176" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
    <rect x="1" y="1" width="358" height="94" rx="11" fill="url(#view4)"/>
    <text class="ph" x="180" y="52" text-anchor="middle">placeholder — not real footage</text>
    <text class="handle" x="14" y="118">⠿</text>
    <text class="name" x="32" y="118">Garage</text>
    <rect x="14" y="128" width="52" height="14" rx="7" fill="none" stroke="#2a2d36"/>
    <text class="chip" x="40" y="138" text-anchor="middle">● online</text>
    <rect x="72" y="128" width="46" height="14" rx="7" fill="none" stroke="#2a2d36"/>
    <text class="chip" x="95" y="138" text-anchor="middle">🔋 1.70 V</text>
    <rect x="124" y="128" width="62" height="14" rx="7" fill="none" stroke="#2a2d36"/>
    <text class="chip" x="155" y="138" text-anchor="middle">wifi ▮▮▮▯▯</text>
    <rect x="14" y="148" width="54" height="18" rx="6" fill="#4c8bf5"/>
    <text class="btn" x="41" y="160" text-anchor="middle">Go live</text>
    <rect x="74" y="148" width="42" height="18" rx="6" fill="none" stroke="#2a2d36"/>
    <text class="btn-alt" x="95" y="160" text-anchor="middle">Hide</text>
  </g>

  <!-- Tile 2 -->
  <g transform="translate(416,64)">
    <rect width="360" height="176" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
    <rect x="1" y="1" width="358" height="94" rx="11" fill="url(#view4)"/>
    <text class="ph" x="180" y="52" text-anchor="middle">placeholder — not real footage</text>
    <text class="handle" x="14" y="118">⠿</text>
    <text class="name" x="32" y="118">Driveway</text>
    <rect x="14" y="128" width="52" height="14" rx="7" fill="none" stroke="#2a2d36"/>
    <text class="chip" x="40" y="138" text-anchor="middle">● online</text>
    <rect x="72" y="128" width="46" height="14" rx="7" fill="none" stroke="#2a2d36"/>
    <text class="chip" x="95" y="138" text-anchor="middle">🔋 1.50 V</text>
    <rect x="124" y="128" width="62" height="14" rx="7" fill="none" stroke="#2a2d36"/>
    <text class="chip" x="155" y="138" text-anchor="middle">wifi ▮▮▮▮▯</text>
    <rect x="14" y="148" width="54" height="18" rx="6" fill="#4c8bf5"/>
    <text class="btn" x="41" y="160" text-anchor="middle">Go live</text>
    <rect x="74" y="148" width="42" height="18" rx="6" fill="none" stroke="#2a2d36"/>
    <text class="btn-alt" x="95" y="160" text-anchor="middle">Hide</text>
  </g>

  <!-- Hidden tray -->
  <g transform="translate(24,258)">
    <text class="tray" x="0" y="14">Hidden:</text>
    <rect x="52" y="0" width="92" height="20" rx="10" fill="none" stroke="#2a2d36"/>
    <text class="traybtn" x="98" y="14" text-anchor="middle">Show Patio</text>
    <rect x="152" y="0" width="72" height="20" rx="10" fill="none" stroke="#2a2d36"/>
    <text class="traybtn" x="188" y="14" text-anchor="middle">Show all</text>
  </g>

  <!-- Benefit callout -->
  <g transform="translate(24,300)">
    <rect width="752" height="58" rx="12" fill="#1a1c22" stroke="#2a2d36"/>
    <text class="save" x="20" y="24">Hidden means idle, not just invisible.</text>
    <text class="note" x="20" y="44">
      A hidden camera stops being polled: no Blink cloud requests, and no battery drain on
      battery-powered models.
    </text>
  </g>

  <text class="note" x="400" y="404" text-anchor="middle">
    Hiding a camera that is streaming also releases its live session on the server.
  </text>
</svg>
